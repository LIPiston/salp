name: Set up pinned Flutter on Linux
description: Restore Flutter 3.50.1 and pub cache for a Linux or Android build.
inputs:
  target:
    description: Platform to precache (linux or android)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: flutter/flutter
        ref: ae9b586f34a8443573f82ef57c3bf914a908cbf7
        path: .ci/flutter
        persist-credentials: false
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          .ci/flutter/bin/cache
          .ci/pub-cache
        key: ${{ runner.os }}-${{ inputs.target }}-flutter-ae9b586-${{ hashFiles('apps/salp/pubspec.lock') }}
    - name: Initialize pinned Flutter
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        git -C .ci/flutter fetch --depth 1 origin tag 3.50.1
        test "$(git -C .ci/flutter rev-parse refs/tags/3.50.1)" = ae9b586f34a8443573f82ef57c3bf914a908cbf7
        echo "$GITHUB_WORKSPACE/.ci/flutter/bin" >> "$GITHUB_PATH"
        echo "PUB_CACHE=$GITHUB_WORKSPACE/.ci/pub-cache" >> "$GITHUB_ENV"
        .ci/flutter/bin/flutter config --no-analytics --enable-linux-desktop
        .ci/flutter/bin/flutter precache "--$BUILD_TARGET"
