name: Nightly release

on:
  schedule:
    # 03:17 every day in Asia/Shanghai (UTC+8).
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize all nightly runs so an older build cannot overwrite a newer release.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  source:
    name: Resolve main commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Pin this run to one main commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows x64
    needs: source
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      artifact-name: salp-nightly-windows-x64

  publish:
    name: Update nightly prerelease
    needs: [source, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - name: Download the tested portable package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: salp-nightly-windows-x64
          path: dist
      - name: Prepare release assets and notes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mv dist/salp-windows-x64.zip dist/salp-windows-x64-nightly.zip
          (
            cd dist
            sha256sum salp-windows-x64-nightly.zip > SHA256SUMS
          )
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          {
            echo '# salp nightly'
            echo
            echo "Built from main commit: \`$SOURCE_SHA\`"
            echo "Build time: $built_at"
            echo "Workflow run: $RUN_URL"
            echo
            echo 'Windows x64 portable development build. Extract the entire ZIP and run salp.exe.'
            echo 'This unsigned prerelease is updated in place after each successful nightly build.'
            echo 'The ZIP includes build-info.json, source archives and third-party licenses.'
            echo 'Verify the download using the attached SHA256SUMS file.'
          } > release-notes.md
      - name: Update nightly branch and tag after a successful build
        run: |
          set -euo pipefail
          # Both refs intentionally track the same successfully tested main commit.
          for ref in heads/nightly tags/nightly; do
            if gh api "repos/$GH_REPO/git/ref/$ref" --silent; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/$ref" \
                -f sha="$SOURCE_SHA" -F force=true --silent
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/$ref" -f sha="$SOURCE_SHA" --silent
            fi
          done
      - name: Create or update the fixed nightly prerelease
        run: |
          set -euo pipefail
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly dist/salp-windows-x64-nightly.zip dist/SHA256SUMS --clobber
            gh release edit nightly \
              --title 'salp nightly' --notes-file release-notes.md \
              --prerelease --latest=false --draft=false --target "$SOURCE_SHA"
          else
            gh release create nightly dist/salp-windows-x64-nightly.zip dist/SHA256SUMS \
              --title 'salp nightly' --notes-file release-notes.md \
              --prerelease --latest=false --verify-tag --target "$SOURCE_SHA"
          fi
          {
            echo '### Nightly prerelease published'
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            gh release view nightly --json url --jq '.url'
          } >> "$GITHUB_STEP_SUMMARY"
