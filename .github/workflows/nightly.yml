name: Nightly release

on:
  schedule:
    # 03:17 every day in Asia/Shanghai (UTC+8).
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize all nightly runs so an older build cannot overwrite a newer release.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  source:
    name: Resolve main commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Pin this run to one main commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows x64
    needs: source
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      artifact-name: salp-nightly-windows-x64

  linux:
    name: Build Linux packages
    needs: source
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  android:
    name: Build Android APKs
    needs: source
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
    secrets: inherit

  publish:
    name: Update nightly prerelease
    needs: [source, windows, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - name: Download all tested platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: salp-nightly-*
          merge-multiple: true
          path: dist
      - name: Prepare release assets and notes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mv dist/salp-windows-x64.zip dist/salp-windows-x64-nightly.zip
          for asset in \
            salp-linux-x64-nightly.deb \
            salp-linux-x64-nightly.pkg.tar.zst \
            salp-linux-x64-nightly.flatpak \
            salp-windows-x64-nightly.zip \
            salp-windows-x64-nightly-setup.exe \
            salp-android-arm64-v8a-nightly.apk \
            salp-android-x86_64-nightly.apk; do
            test -s "dist/$asset"
          done
          (
            cd dist
            sha256sum -- *.deb *.pkg.tar.zst *.flatpak *.zip *.exe *.apk > SHA256SUMS
          )
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          {
            echo '# salp nightly'
            echo
            echo "Built from main commit: \`$SOURCE_SHA\`"
            echo "Build time: $built_at"
            echo "Workflow run: $RUN_URL"
            echo
            echo '| Platform | Packages |'
            echo '| --- | --- |'
            echo '| Linux x86_64 | Debian/Ubuntu .deb, Arch .pkg.tar.zst, Flatpak .flatpak |'
            echo '| Windows x64 | Portable .zip and per-user -setup.exe installer |'
            echo '| Android | Separate arm64-v8a (ARMv8) and x86_64 APKs |'
            echo
            echo 'This prerelease is updated in place after all nightly platform builds succeed.'
            echo 'Android APKs use the persistent nightly signing key; desktop packages are not code-signed.'
            echo 'Linux native packages require glibc 2.35+, GTK 3 and Secret Service; Flatpak uses GNOME 49.'
            echo 'The Flatpak local terminal runs inside its sandbox.'
            echo 'Desktop packages include build-info.json, source archives and third-party licenses.'
            echo 'Verify the download using the attached SHA256SUMS file.'
          } > release-notes.md
      - name: Update nightly branch and tag after a successful build
        run: |
          set -euo pipefail
          # Both refs intentionally track the same successfully tested main commit.
          for ref in heads/nightly tags/nightly; do
            if gh api "repos/$GH_REPO/git/ref/$ref" --silent; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/$ref" \
                -f sha="$SOURCE_SHA" -F force=true --silent
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/$ref" -f sha="$SOURCE_SHA" --silent
            fi
          done
      - name: Create or update the fixed nightly prerelease
        run: |
          set -euo pipefail
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly \
              --title 'salp nightly' --notes-file release-notes.md \
              --prerelease --latest=false --draft=false --target "$SOURCE_SHA"
          else
            gh release create nightly dist/* \
              --title 'salp nightly' --notes-file release-notes.md \
              --prerelease --latest=false --verify-tag --target "$SOURCE_SHA"
          fi
          {
            echo '### Nightly prerelease published'
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            gh release view nightly --json url --jq '.url'
          } >> "$GITHUB_STEP_SUMMARY"
